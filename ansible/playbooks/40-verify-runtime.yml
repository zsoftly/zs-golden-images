---
- name: Verify isolated candidate runtime readiness without configuring it
  hosts: golden_candidates
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require the explicit candidate scope
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'GOLDEN_APPLY') == 'verify'
          - golden_runtime_approved | default(false) | bool
          - golden_profile in ['debian-13', 'ubuntu-26.04']
          - golden_target in ['cloudstack-kvm', 'proxmox-lxc']
          - golden_enrollment_policy in ['public', 'managed']
          - ansible_facts.virtualization_role == 'guest'
          - (golden_target == 'cloudstack-kvm' and ansible_facts.virtualization_type == 'kvm') or (golden_target == 'proxmox-lxc' and ansible_facts.virtualization_type == 'lxc')
          - (golden_profile == 'debian-13' and ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version == '13') or (golden_profile == 'ubuntu-26.04' and ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version == '26.04')
  roles:
    - runtime_checks
