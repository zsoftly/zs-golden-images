---
- name: Require explicit staged CI native inputs and capacity policy
  ansible.builtin.assert:
    that:
      - golden_builder_ci_native_site is match('^/[A-Za-z0-9_./-]+\.json$')
      - golden_builder_ci_lxc_id_base | int >= 65536
      - golden_builder_ci_lxc_id_base | int + 65536 <= 4294967295
      - golden_builder_ci_min_free_bytes | int > 0
- name: Create protected dispatcher state and approval directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - "{{ golden_builder_prefix }}/ci"
    - "{{ golden_builder_prefix }}/ci/evidence"
    - "{{ golden_builder_prefix }}/ci/inputs"
    - "{{ golden_builder_prefix }}/ci/operations"
    - /etc/zs-golden-images/ci-requests
- name: Install the guarded dispatcher without granting runner privileges
  ansible.builtin.copy:
    src: dispatch_candidate.py
    dest: "{{ golden_builder_prefix }}/bin/dispatch-candidate"
    owner: root
    group: root
    mode: '0755'
- name: Install a private Ansible configuration for dispatcher operations
  ansible.builtin.copy:
    dest: "{{ golden_builder_prefix }}/ci/ansible.cfg"
    content: "[defaults]\n"
    owner: root
    group: root
    mode: '0600'
- name: Write root-owned dispatcher configuration
  ansible.builtin.copy:
    dest: /etc/zs-golden-images/ci.json
    owner: root
    group: root
    mode: '0600'
    content: "{{ {'project': golden_builder_prefix + '/project', 'state': golden_builder_prefix + '/ci', 'workspace': golden_builder_workspace, 'native_site': golden_builder_ci_native_site, 'lxc_id_base': golden_builder_ci_lxc_id_base | int, 'min_free_bytes': golden_builder_ci_min_free_bytes | int} | to_nice_json }}\n"
